name: Validate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  EXPECTED_SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

jobs:
  quality:
    name: Rust quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SOURCE_SHA }}
      - name: Verify checked-out source identity
        shell: bash
        run: |
          set -euo pipefail
          actual=$(git rev-parse HEAD)
          test "$actual" = "$EXPECTED_SOURCE_SHA"
          printf 'VALIDATED_SOURCE_SHA=%s\n' "$actual"
      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Release identity regression checks
        run: python3 .github/scripts/test-release-source.py
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      # Prebuilt binary: independent of the pinned MSRV toolchain (building
      # latest cargo-audit from source requires a newer rustc than 1.85).
      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Cargo audit (RustSec advisories)
        run: cargo audit

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.EXPECTED_SOURCE_SHA }}
      - name: Verify checked-out source identity
        shell: bash
        run: |
          set -euo pipefail
          actual=$(git rev-parse HEAD)
          test "$actual" = "$EXPECTED_SOURCE_SHA"
          printf 'VALIDATED_SOURCE_SHA=%s\n' "$actual"
      - uses: dtolnay/rust-toolchain@1.85.0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.os }}
      - name: Old-candidate native positive controls
        if: ${{ runner.os == 'Linux' }}
        run: python3 .github/scripts/check-native-controls.py
      - name: Test
        run: cargo test --all-targets --locked

  package-and-dogfood:
    name: Package and dogfood
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SOURCE_SHA }}
      - name: Verify checked-out source identity
        shell: bash
        run: |
          set -euo pipefail
          actual=$(git rev-parse HEAD)
          test "$actual" = "$EXPECTED_SOURCE_SHA"
          printf 'VALIDATED_SOURCE_SHA=%s\n' "$actual"
      - uses: dtolnay/rust-toolchain@1.85.0
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Build release binary
        run: cargo build --release --locked
      - name: Scan repository (structural patterns only, strict)
        run: ./target/release/doxguard scan --all-tracked --block --strict
      - name: Check npm launcher syntax
        run: node --check bin/doxguard.js
      - name: Verify npm package file list
        run: npm pack --dry-run --json --ignore-scripts
