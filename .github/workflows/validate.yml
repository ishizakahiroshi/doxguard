name: Validate

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly so `cargo audit` keeps running even while push-triggered runs are
    # not delivered in this repo (see docs bugfix T06 / F-C06); schedule events
    # are independent of push delivery.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Rust quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.85.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      # Prebuilt binary: independent of the pinned MSRV toolchain (building
      # latest cargo-audit from source requires a newer rustc than 1.85).
      - name: Install cargo-audit
        uses: taiki-e/install-action@b20dedce73af6905cdc30d6611090c9b67557c8d # v2
        with:
          tool: cargo-audit
      - name: Cargo audit (RustSec advisories)
        run: cargo audit

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.85.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: ${{ matrix.os }}
      - name: Test
        run: cargo test --all-targets --locked

  package-and-dogfood:
    name: Package and dogfood
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.85.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
      - name: Build release binary
        run: cargo build --release --locked
      - name: Scan repository (structural patterns only, strict)
        run: ./target/release/doxguard scan --all-tracked --block --strict
      - name: Check npm launcher syntax
        run: node --check bin/doxguard.js
      - name: Verify npm package file list
        run: npm pack --dry-run --json --ignore-scripts
