<!doctype html><html lang="ja"><meta charset="utf-8"><title>05_fig-separation</title><style>*{box-sizing:border-box}html,body{margin:0;width:1600px;height:900px;overflow:hidden}body{position:relative}img,.shape,.label{position:absolute}.geometry{position:absolute;inset:0;pointer-events:none}</style><body><div class="shape" style="left:0px;top:0px;width:1600px;height:900px;background:#eef6fc;"></div><div class="shape" style="left:64px;top:48px;width:12px;height:55px;background:#b8751b;"></div><div class="label" style="left:97px;top:37px;width:1441px;height:75px;font-family:sans-serif;font-size:44px;line-height:1.35;color:#18344f;font-weight:700;text-align:left;margin:0;padding:0;">「元に戻す必要があるか」で、使い分ける</div><div class="label" style="left:97px;top:116px;width:1441px;height:46px;font-family:sans-serif;font-size:25px;line-height:1.35;color:#49667e;font-weight:400;text-align:left;margin:0;padding:0;">ハッシュ化・暗号化・検索用のHMACは、役割が違う</div><div class="shape" style="left:470px;top:177px;width:660px;height:80px;background:#18344f;"></div><div class="label" style="left:488px;top:187px;width:624px;height:60px;font-family:sans-serif;font-size:35px;line-height:1.35;color:#ffffff;font-weight:700;text-align:center;margin:0;padding:0;">元に戻す必要がある？</div><svg class="geometry" width="1600" height="900" viewBox="0 0 1600 900"><path d="M 800 257 L 800 287" fill="none" stroke="#18344f" stroke-width="4"/></svg><svg class="geometry" width="1600" height="900" viewBox="0 0 1600 900"><path d="M 386 287 L 1201 287" fill="none" stroke="#18344f" stroke-width="4"/></svg><svg class="geometry" width="1600" height="900" viewBox="0 0 1600 900"><path d="M 386 287 L 386 351 M 379.07331236687776 337.6950761583107 L 386 351 L 392.92668763312224 337.6950761583107" fill="none" stroke="#18344f" stroke-width="4"/></svg><svg class="geometry" width="1600" height="900" viewBox="0 0 1600 900"><path d="M 1201 287 L 1201 351 M 1194.0733123668776 337.6950761583107 L 1201 351 L 1207.9266876331224 337.6950761583107" fill="none" stroke="#18344f" stroke-width="4"/></svg><div class="label" style="left:226px;top:294px;width:134px;height:46px;font-family:sans-serif;font-size:25px;line-height:1.35;color:#49667e;font-weight:500;text-align:center;margin:0;padding:0;">いいえ</div><div class="label" style="left:1240px;top:294px;width:134px;height:46px;font-family:sans-serif;font-size:25px;line-height:1.35;color:#49667e;font-weight:500;text-align:center;margin:0;padding:0;">はい</div><div class="shape" style="left:64px;top:365px;width:684px;height:233px;background:#ffffff;border:1px solid #c6dae9;"></div><div class="label" style="left:91px;top:385px;width:629px;height:65px;font-family:sans-serif;font-size:42px;line-height:1.35;color:#18344f;font-weight:700;text-align:left;margin:0;padding:0;">ハッシュ化</div><div class="label" style="left:93px;top:456px;width:625px;height:121px;font-family:sans-serif;font-size:29px;line-height:1.35;color:#49667e;font-weight:400;text-align:left;margin:0;padding:0;">例：パスワード<br>元の値へ戻さず、一致を確認する。<br>Argon2idやbcryptなどを使う。</div><div class="shape" style="left:851px;top:365px;width:684px;height:233px;background:#ffffff;border:1px solid #c6dae9;"></div><div class="label" style="left:880px;top:385px;width:628px;height:65px;font-family:sans-serif;font-size:39px;line-height:1.35;color:#18344f;font-weight:700;text-align:left;margin:0;padding:0;">暗号化 ＋ 鍵を分ける</div><div class="label" style="left:880px;top:456px;width:624px;height:121px;font-family:sans-serif;font-size:29px;line-height:1.35;color:#49667e;font-weight:400;text-align:left;margin:0;padding:0;">例：メールアドレス・住所<br>必要なときに復号して使う。<br>データと鍵、利用権限を分ける。</div><div class="shape" style="left:64px;top:625px;width:684px;height:142px;background:#dcebf6;"></div><div class="label" style="left:91px;top:637px;width:629px;height:123px;font-family:sans-serif;font-size:28px;line-height:1.35;color:#18344f;font-weight:400;text-align:left;margin:0;padding:0;">暗号化だけで安心とは言えない。<br>権限・ログ・バックアップ・コピー先も<br>あわせて考える。</div><svg class="geometry" width="1600" height="900" viewBox="0 0 1600 900"><path d="M 1193 598 L 1193 617 M 1186.0733123668776 603.6950761583107 L 1193 617 L 1199.9266876331224 603.6950761583107" fill="none" stroke="#b8751b" stroke-width="4"/></svg><div class="shape" style="left:851px;top:625px;width:684px;height:142px;background:#fff1d7;"></div><div class="label" style="left:880px;top:636px;width:627px;height:46px;font-family:sans-serif;font-size:29px;line-height:1.35;color:#18344f;font-weight:700;text-align:left;margin:0;padding:0;">検索も必要なら、検索用のHMAC</div><div class="label" style="left:880px;top:689px;width:627px;height:70px;font-family:sans-serif;font-size:27px;line-height:1.15;color:#49667e;font-weight:400;text-align:left;margin:0;padding:0;">元データは暗号化したまま、<br>検索用には別の値を持つ。</div><div class="shape" style="left:64px;top:799px;width:1472px;height:61px;background:#18344f;"></div><div class="label" style="left:83px;top:807px;width:1435px;height:44px;font-family:sans-serif;font-size:28px;line-height:1.35;color:#ffffff;font-weight:700;text-align:left;margin:0;padding:0;">そもそも不要なら持たない。役目を終えたデータは、保持要件を見て消す。</div></body></html>
