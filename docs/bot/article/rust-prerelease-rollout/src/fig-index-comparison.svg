<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#3E887F"/></marker></defs><rect x="0" y="0" width="1600" height="900" rx="0" fill="#F5F1E8" stroke="none" stroke-width="1"/><rect x="60" y="40" width="8" height="53" rx="4" fill="#3E887F" stroke="none" stroke-width="1"/><text x="86" y="80" fill="#182D3D" font-family="Noto Sans CJK JP, sans-serif" font-size="41" font-weight="700" text-anchor="start">「呼べる」と「変更を受け入れられる」を分ける</text><text x="86" y="126" fill="#5D6A71" font-family="Noto Sans CJK JP, sans-serif" font-size="27" font-weight="400" text-anchor="start">空indexの配線確認の後に、仮想indexで内容を比較する</text><rect x="60" y="172" width="715" height="565" rx="20" fill="#EBEBE3" stroke="none" stroke-width="1"/><rect x="825" y="172" width="715" height="565" rx="20" fill="#E0ECE6" stroke="none" stroke-width="1"/><text x="94" y="220" fill="#182D3D" font-family="Noto Sans CJK JP, sans-serif" font-size="31" font-weight="700" text-anchor="start">1 / 空indexで配線を確認</text><text x="859" y="220" fill="#182D3D" font-family="Noto Sans CJK JP, sans-serif" font-size="31" font-weight="700" text-anchor="start">2 / 仮想indexで内容を比較</text><rect x="99" y="254" width="637" height="92" rx="14" fill="#FFFDFA" stroke="none" stroke-width="1"/><text x="417" y="294" fill="#182D3D" font-family="Noto Sans CJK JP, sans-serif" font-size="30" font-weight="700" text-anchor="middle">空index</text><text x="417" y="327" fill="#5D6A71" font-family="Noto Sans CJK JP, sans-serif" font-size="23" font-weight="400" text-anchor="middle">変更内容なし</text><path d="M 417 350 L 417 375" fill="none" stroke="#3E887F" stroke-width="3" marker-end="url(#arrow)"/><rect x="99" y="382" width="637" height="92" rx="14" fill="#FFFDFA" stroke="none" stroke-width="1"/><text x="417" y="422" fill="#182D3D" font-family="Noto Sans CJK JP, sans-serif" font-size="30" font-weight="700" text-anchor="middle">追加検査 + 実hook</text><text x="417" y="454" fill="#5D6A71" font-family="Noto Sans CJK JP, sans-serif" font-size="23" font-weight="400" text-anchor="middle">呼び出しが動くことを確認</text><path d="M 417 478 L 417 503" fill="none" stroke="#3E887F" stroke-width="3" marker-end="url(#arrow)"/><rect x="99" y="510" width="637" height="116" rx="14" fill="#D0E5DC" stroke="none" stroke-width="1"/><text x="417" y="554" fill="#3E887F" font-family="Noto Sans CJK JP, sans-serif" font-size="30" font-weight="700" text-anchor="middle">配線の確認は通った</text><text x="417" y="595" fill="#182D3D" font-family="Noto Sans CJK JP, sans-serif" font-size="26" font-weight="700" text-anchor="middle">実変更の受入までは証明しない</text><text x="417" y="687" fill="#5D6A71" font-family="Noto Sans CJK JP, sans-serif" font-size="24" font-weight="400" text-anchor="middle">入力が空なら、内容に由来する停止は見えない</text><rect x="864" y="254" width="637" height="83" rx="14" fill="#FFFDFA" stroke="none" stroke-width="1"/><text x="1182" y="305" fill="#182D3D" font-family="Noto Sans CJK JP, sans-serif" font-size="30" font-weight="700" text-anchor="middle">仮想indexに変更相当の内容</text><line x1="1182" y1="339" x2="1182" y2="350" stroke="#3E887F" stroke-width="3"/><line x1="1008" y1="350" x2="1358" y2="350" stroke="#3E887F" stroke-width="3"/><path d="M 1008 350 L 1008 365" fill="none" stroke="#3E887F" stroke-width="3" marker-end="url(#arrow)"/><path d="M 1358 350 L 1358 365" fill="none" stroke="#3E887F" stroke-width="3" marker-end="url(#arrow)"/><rect x="864" y="373" width="294" height="84" rx="14" fill="#FFFDFA" stroke="none" stroke-width="1"/><text x="1011" y="424" fill="#182D3D" font-family="Noto Sans CJK JP, sans-serif" font-size="29" font-weight="700" text-anchor="middle">旧検査</text><rect x="1207" y="373" width="294" height="84" rx="14" fill="#FFFDFA" stroke="none" stroke-width="1"/><text x="1354" y="424" fill="#3E887F" font-family="Noto Sans CJK JP, sans-serif" font-size="29" font-weight="700" text-anchor="middle">Rust追加検査</text><line x1="1011" y1="459" x2="1011" y2="470" stroke="#3E887F" stroke-width="3"/><line x1="1354" y1="459" x2="1354" y2="470" stroke="#3E887F" stroke-width="3"/><line x1="1011" y1="470" x2="1354" y2="470" stroke="#3E887F" stroke-width="3"/><path d="M 1182 470 L 1182 488" fill="none" stroke="#3E887F" stroke-width="3" marker-end="url(#arrow)"/><rect x="864" y="496" width="637" height="67" rx="14" fill="#FFFDFA" stroke="none" stroke-width="1"/><text x="1182" y="539" fill="#182D3D" font-family="Noto Sans CJK JP, sans-serif" font-size="27" font-weight="700" text-anchor="middle">旧clean29 / 新clean14・新block16</text><line x1="1182" y1="565" x2="1182" y2="577" stroke="#3E887F" stroke-width="3"/><line x1="1011" y1="577" x2="1354" y2="577" stroke="#3E887F" stroke-width="3"/><path d="M 1011 577 L 1011 593" fill="none" stroke="#3E887F" stroke-width="3" marker-end="url(#arrow)"/><path d="M 1354 577 L 1354 593" fill="none" stroke="#3E887F" stroke-width="3" marker-end="url(#arrow)"/><rect x="864" y="601" width="294" height="82" rx="14" fill="#BFDACE" stroke="none" stroke-width="1"/><text x="1011" y="637" fill="#3E887F" font-family="Noto Sans CJK JP, sans-serif" font-size="29" font-weight="700" text-anchor="middle">15有効</text><text x="1011" y="667" fill="#182D3D" font-family="Noto Sans CJK JP, sans-serif" font-size="21" font-weight="400" text-anchor="middle">旧検査も停止の1件を含む</text><rect x="1207" y="601" width="294" height="82" rx="14" fill="#F0D4C7" stroke="none" stroke-width="1"/><text x="1354" y="637" fill="#A3513E" font-family="Noto Sans CJK JP, sans-serif" font-size="29" font-weight="700" text-anchor="middle">15保留</text><text x="1354" y="667" fill="#182D3D" font-family="Noto Sans CJK JP, sans-serif" font-size="21" font-weight="400" text-anchor="middle">旧検査を続けて影響を確認</text><text x="1182" y="719" fill="#5D6A71" font-family="Noto Sans CJK JP, sans-serif" font-size="23" font-weight="400" text-anchor="middle">比較結果から、リポジトリごとに判断する</text><rect x="60" y="767" width="1480" height="90" rx="14" fill="#182D3D" stroke="none" stroke-width="1"/><rect x="87" y="796" width="48" height="33" rx="4" fill="none" stroke="#C9DED4" stroke-width="3"/><rect x="95" y="786" width="48" height="33" rx="4" fill="#182D3D" stroke="#C9DED4" stroke-width="3"/><text x="169" y="812" fill="#FFFFFF" font-family="Noto Sans CJK JP, sans-serif" font-size="31" font-weight="700" text-anchor="start">実際のindexは変更しない</text><text x="860" y="812" fill="#FFFFFF" font-family="Noto Sans CJK JP, sans-serif" font-size="28" font-weight="700" text-anchor="start">既存検査・CIも残したまま進める</text><text x="62" y="889" fill="#5D6A71" font-family="Noto Sans CJK JP, sans-serif" font-size="22" font-weight="400" text-anchor="start">模式図。仮想indexの比較は自然な実使用の観測とは別で、後者はまだ0件です。</text></svg>