<text x="1403.5" y="380" font-family="Noto Sans CJK JP, sans-serif" font-size="30" font-weight="700" text-anchor="middle" fill="#382A43">PRのCI</text>
<text x="1403.5" y="422" font-family="Noto Sans CJK JP, sans-serif" font-size="26" font-weight="400" text-anchor="middle" fill="#795773">成功を確認</text>
<polyline points="498,478 498,527 305,527 305,574" fill="none" stroke="#C97061" stroke-width="4" stroke-linejoin="round"/>
<polygon points="305,574 311,561 299,561" fill="#C97061"/>
<text x="331" y="514" font-family="Noto Sans CJK JP, sans-serif" font-size="25" font-weight="700" text-anchor="start" fill="#C97061">条件に該当</text>
<rect x="65" y="577" width="478" height="174" rx="18" fill="#F6F0E6" stroke="#C97061" stroke-width="3"/>
<text x="90" y="618" font-family="Noto Sans CJK JP, sans-serif" font-size="27" font-weight="700" text-anchor="start" fill="#C97061">止まる条件に当たったら</text>
<text x="90" y="673" font-family="Noto Sans CJK JP, sans-serif" font-size="40" font-weight="700" text-anchor="start" fill="#382A43">止めて人へ</text>
<text x="90" y="719" font-family="Noto Sans CJK JP, sans-serif" font-size="28" font-weight="400" text-anchor="start" fill="#795773">条件の外へは進めない</text>
<polyline points="1403,448 1403,522 895,522 895,574" fill="none" stroke="#382A43" stroke-width="4" stroke-linejoin="round"/>
<polygon points="895,574 901,561 889,561" fill="#382A43"/>
<text x="1115" y="560" font-family="Noto Sans CJK JP, sans-serif" font-size="25" font-weight="400" text-anchor="start" fill="#795773">連鎖の最後に</text>
<rect x="674" y="577" width="441" height="174" rx="18" fill="#F6F0E6" stroke="#795773" stroke-width="3"/>
<text x="700" y="624" font-family="Noto Sans CJK JP, sans-serif" font-size="36" font-weight="700" text-anchor="start" fill="#382A43">別の製品のAI</text>
<text x="700" y="674" font-family="Noto Sans CJK JP, sans-serif" font-size="36" font-weight="700" text-anchor="start" fill="#382A43">全行をレビュー</text>
<text x="700" y="718" font-family="Noto Sans CJK JP, sans-serif" font-size="27" font-weight="400" text-anchor="start" fill="#795773">取り込む前に置く</text>
<polyline points="1120,663 1190,663" fill="none" stroke="#382A43" stroke-width="4" stroke-linejoin="round"/>
<polygon points="1190,663 1177,657 1177,669" fill="#382A43"/>
<rect x="1194" y="577" width="340" height="174" rx="18" fill="#382A43"/>
<text x="1220" y="624" font-family="Noto Sans CJK JP, sans-serif" font-size="36" font-weight="700" text-anchor="start" fill="#F6F0E6">人の受入</text>
<text x="1220" y="674" font-family="Noto Sans CJK JP, sans-serif" font-size="36" font-weight="700" text-anchor="start" fill="#F6F0E6">取り込み</text>
<text x="1220" y="718" font-family="Noto Sans CJK JP, sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#F6F0E6">持ち主の承認で手元が実施</text>
<polyline points="65,787 1534,787" fill="none" stroke="#819786" stroke-width="2" stroke-linejoin="round"/>
<text x="65" y="828" font-family="Noto Sans CJK JP, sans-serif" font-size="30" font-weight="700" text-anchor="start" fill="#382A43">人が関わるのは、最初・最後・止まったとき。</text>
<text x="65" y="872" font-family="Noto Sans CJK JP, sans-serif" font-size="26" font-weight="400" text-anchor="start" fill="#795773">実際の初回レビューは取り込み後。この図は、次回の取り込み前に置く型。</text>
</svg>
