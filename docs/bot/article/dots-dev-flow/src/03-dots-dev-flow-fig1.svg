<text x="935.5" y="380" font-family="Noto Sans CJK JP, sans-serif" font-size="30" font-weight="700" text-anchor="middle" fill="#382A43">PRのCI</text>
<text x="935.5" y="422" font-family="Noto Sans CJK JP, sans-serif" font-size="26" font-weight="400" text-anchor="middle" fill="#795773">成功を確認</text>
<polyline points="1042,369 1062,369" fill="none" stroke="#382A43" stroke-width="3" stroke-linejoin="round"/>
<polygon points="1062,369 1049,363 1049,375" fill="#382A43"/>
<rect x="1064" y="282" width="211" height="166" rx="13" fill="#F6F0E6" stroke="#795773" stroke-width="2"/>
<rect x="1064" y="282" width="211" height="49" rx="13" fill="#819786"/>
<rect x="1064" y="310" width="211" height="21" rx="0" fill="#819786"/>
<text x="1169.5" y="318" font-family="Noto Sans CJK JP, sans-serif" font-size="29" font-weight="700" text-anchor="middle" fill="#382A43">工程3</text>
<text x="1169.5" y="380" font-family="Noto Sans CJK JP, sans-serif" font-size="30" font-weight="700" text-anchor="middle" fill="#382A43">PRのCI</text>
<text x="1169.5" y="422" font-family="Noto Sans CJK JP, sans-serif" font-size="26" font-weight="400" text-anchor="middle" fill="#795773">成功を確認</text>
<polyline points="1276,369 1296,369" fill="none" stroke="#382A43" stroke-width="3" stroke-linejoin="round"/>
<polygon points="1296,369 1283,363 1283,375" fill="#382A43"/>
<rect x="1298" y="282" width="211" height="166" rx="13" fill="#F6F0E6" stroke="#795773" stroke-width="2"/>
<rect x="1298" y="282" width="211" height="49" rx="13" fill="#819786"/>
<rect x="1298" y="310" width="211" height="21" rx="0" fill="#819786"/>
