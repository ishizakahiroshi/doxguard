<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="900" viewBox="0 0 1600 900"><style>text{font-family:"Noto Sans CJK JP",sans-serif;fill:#382A43}.bold{font-weight:700}</style><title>取り決めから読み直しまで</title><desc>取り決めを文書化し、1回の承認で工程を任せ、別のAIでレビューし、修正後に読み直して取り込む4手順。</desc>
<rect width="1600" height="900" fill="#F6F0E6"/>
<text x="72" y="90" font-size="52" class="bold">取り決めから、読み直しまで</text>
<text x="74" y="141" font-size="27" fill="#795773">Deskly の機能を dots に任せた流れ</text>
<defs><clipPath id="artclip"><rect x="44" y="169" width="1512" height="320" rx="12"/></clipPath></defs>
<g clip-path="url(#artclip)"><image x="24" y="-92" width="1552" height="874" preserveAspectRatio="xMidYMid meet" xlink:href="infographic-art.png"/></g>
<text x="72" y="550" font-size="30" fill="#C97061">01</text><text x="133" y="550" font-size="48" class="bold">取り決めを先に</text><text x="133" y="609" font-size="32">正本・状態・印を文書で決めた</text><text x="835" y="550" font-size="30" fill="#C97061">02</text><text x="896" y="550" font-size="48" class="bold">1回の承認で連鎖</text><text x="896" y="609" font-size="32">環境で停止後、検証をCIへ移した</text><text x="72" y="711" font-size="30" fill="#C97061">03</text><text x="133" y="711" font-size="48" class="bold">別のAIがレビュー</text><text x="133" y="770" font-size="32">CIが緑でも、重大1件・中12件</text><text x="835" y="711" font-size="30" fill="#C97061">04</text><text x="896" y="711" font-size="48" class="bold">直して、読み直す</text><text x="896" y="770" font-size="32">重大0を確認して取り込んだ</text><path d="M72 809H1528" stroke="#D9CBCF" stroke-width="2"/><text x="72" y="856" font-size="27">読み直しで新たな中2件。次の工程の最初に直すことにした。</text></svg>