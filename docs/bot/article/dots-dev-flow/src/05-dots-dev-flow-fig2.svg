<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">CIが緑でも、読み直す余地は残る</title><desc id="desc">初回の別製品AIレビューでは、重大1件、中12件、軽約20件を確認。別軸でテスト名とassertの食い違いも約20件あり、この数は重大・中・軽と足し合わせない。修正後の読み直しでは重大0件、新しい中2件が見つかり、次の工程の最初で直すことにした。テストの弱さは、期待するエラーの種類を見ず拒否だけを確かめる、同時100件と書きながら1件ずつ直列に処理する、呼ばれない関数の呼び出し回数0を確かめる、の3つ。テスト件数は346から580、718へ増えた。</desc>
<rect width="1600" height="900" fill="#F6F0E6"/>
<rect x="66" y="54" width="12" height="67" rx="6" fill="#C97061"/>
<text x="100" y="101" font-family="Noto Sans CJK JP, sans-serif" font-size="50" font-weight="700" text-anchor="start" fill="#382A43">CIが緑でも、読み直す余地は残る</text>
<text x="100" y="153" font-family="Noto Sans CJK JP, sans-serif" font-size="28" font-weight="400" text-anchor="start" fill="#795773">初回の別製品AIレビュー → 修正 → 読み直し</text>
<text x="65" y="203" font-family="Noto Sans CJK JP, sans-serif" font-size="27" font-weight="700" text-anchor="start" fill="#382A43">CI 580件成功・dots内レビューは指摘なし</text>
<rect x="65" y="224" width="220" height="177" rx="15" fill="#F6F0E6" stroke="#C97061" stroke-width="3"/>
<rect x="65" y="224" width="220" height="8" rx="4" fill="#C97061"/>
<text x="175" y="276" font-family="Noto Sans CJK JP, sans-serif" font-size="31" font-weight="700" text-anchor="middle" fill="#C97061">重大</text>
<text x="175" y="360" font-family="Noto Sans CJK JP, sans-serif" font-size="70" font-weight="700" text-anchor="middle" fill="#382A43">1</text>
<text x="264" y="384" font-family="Noto Sans CJK JP, sans-serif" font-size="23" font-weight="400" text-anchor="end" fill="#795773">件</text>
<rect x="306" y="224" width="220" height="177" rx="15" fill="#F6F0E6" stroke="#795773" stroke-width="3"/>
<rect x="306" y="224" width="220" height="8" rx="4" fill="#795773"/>
<text x="416" y="276" font-family="Noto Sans CJK JP, sans-serif" font-size="31" font-weight="700" text-anchor="middle" fill="#795773">中</text>
<text x="416" y="360" font-family="Noto Sans CJK JP, sans-serif" font-size="70" font-weight="700" text-anchor="middle" fill="#382A43">12</text>
<text x="505" y="384" font-family="Noto Sans CJK JP, sans-serif" font-size="23" font-weight="400" text-anchor="end" fill="#795773">件</text>
<rect x="547" y="224" width="220" height="177" rx="15" fill="#F6F0E6" stroke="#819786" stroke-width="3"/>
<rect x="547" y="224" width="220" height="8" rx="4" fill="#819786"/>
<text x="657" y="276" font-family="Noto Sans CJK JP, sans-serif" font-size="31" font-weight="700" text-anchor="middle" fill="#819786">軽</text>
<text x="657" y="360" font-family="Noto Sans CJK JP, sans-serif" font-size="70" font-weight="700" text-anchor="middle" fill="#382A43">約20</text>
<text x="746" y="384" font-family="Noto Sans CJK JP, sans-serif" font-size="23" font-weight="400" text-anchor="end" fill="#795773">件</text>
<polyline points="815,233 815,393" fill="none" stroke="#819786" stroke-width="2" stroke-linejoin="round"/>
<text x="866" y="258" font-family="Noto Sans CJK JP, sans-serif" font-size="29" font-weight="700" text-anchor="start" fill="#795773">別軸｜テスト名とassertの食い違い</text>
<text x="866" y="335" font-family="Noto Sans CJK JP, sans-serif" font-size="63" font-weight="700" text-anchor="start" fill="#382A43">約20件</text>
<text x="866" y="384" font-family="Noto Sans CJK JP, sans-serif" font-size="27" font-weight="400" text-anchor="start" fill="#795773">重大・中・軽の件数とは足し合わせない</text>
<rect x="65" y="432" width="1470" height="121" rx="17" fill="#382A43"/>
<text x="91" y="480" font-family="Noto Sans CJK JP, sans-serif" font-size="28" font-weight="400" text-anchor="start" fill="#F6F0E6">修正後の</text>
<text x="91" y="525" font-family="Noto Sans CJK JP, sans-serif" font-size="33" font-weight="700" text-anchor="start" fill="#F6F0E6">読み直し</text>
