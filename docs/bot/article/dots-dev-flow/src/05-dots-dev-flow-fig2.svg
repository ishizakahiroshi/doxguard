<text x="600" y="505" font-family="Noto Sans CJK JP, sans-serif" font-size="41" font-weight="700" text-anchor="start" fill="#F6F0E6">新しい中 2件</text>
<polyline points="905,491 971,491" fill="none" stroke="#F6F0E6" stroke-width="3" stroke-linejoin="round"/>
<polygon points="971,491 958,485 958,497" fill="#F6F0E6"/>
<text x="1005" y="479" font-family="Noto Sans CJK JP, sans-serif" font-size="30" font-weight="400" text-anchor="start" fill="#F6F0E6">次の工程の最初で</text>
<text x="1005" y="525" font-family="Noto Sans CJK JP, sans-serif" font-size="32" font-weight="700" text-anchor="start" fill="#F6F0E6">直すことにした</text>
<text x="65" y="611" font-family="Noto Sans CJK JP, sans-serif" font-size="36" font-weight="700" text-anchor="start" fill="#382A43">テストの弱さは、名前とassertの間にあった</text>
<rect x="65" y="636" width="474" height="170" rx="15" fill="#F6F0E6" stroke="#819786" stroke-width="2"/>
<rect x="87" y="659" width="5" height="33" rx="2" fill="#C97061"/>
<text x="108" y="687" font-family="Noto Sans CJK JP, sans-serif" font-size="28" font-weight="700" text-anchor="start" fill="#382A43">エラーの種類を見ない</text>
<text x="89" y="739" font-family="Noto Sans CJK JP, sans-serif" font-size="28" font-weight="400" text-anchor="start" fill="#795773">「拒否された」だけで通る</text>
<text x="89" y="781" font-family="Noto Sans CJK JP, sans-serif" font-size="28" font-weight="400" text-anchor="start" fill="#795773">検査を消しても通る</text>
<rect x="563" y="636" width="474" height="170" rx="15" fill="#F6F0E6" stroke="#819786" stroke-width="2"/>
<rect x="585" y="659" width="5" height="33" rx="2" fill="#C97061"/>
<text x="606" y="687" font-family="Noto Sans CJK JP, sans-serif" font-size="28" font-weight="700" text-anchor="start" fill="#382A43">「同時100件」が直列</text>
<text x="587" y="739" font-family="Noto Sans CJK JP, sans-serif" font-size="28" font-weight="400" text-anchor="start" fill="#795773">実際は1件ずつ</text>
<text x="587" y="781" font-family="Noto Sans CJK JP, sans-serif" font-size="28" font-weight="400" text-anchor="start" fill="#795773">順番に処理されている</text>
<rect x="1061" y="636" width="474" height="170" rx="15" fill="#F6F0E6" stroke="#819786" stroke-width="2"/>
<rect x="1083" y="659" width="5" height="33" rx="2" fill="#C97061"/>
<text x="1104" y="687" font-family="Noto Sans CJK JP, sans-serif" font-size="28" font-weight="700" text-anchor="start" fill="#382A43">呼ばれない関数の回数0</text>
<text x="1085" y="739" font-family="Noto Sans CJK JP, sans-serif" font-size="28" font-weight="400" text-anchor="start" fill="#795773">もともと呼ばれない関数の</text>
<text x="1085" y="781" font-family="Noto Sans CJK JP, sans-serif" font-size="28" font-weight="400" text-anchor="start" fill="#795773">0回を確かめている</text>
<text x="65" y="865" font-family="Noto Sans CJK JP, sans-serif" font-size="29" font-weight="700" text-anchor="start" fill="#795773">テスト件数：346 → 580 → 718</text>
</svg>
