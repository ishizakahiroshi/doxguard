</style><body><h1>記録を増やす前に、守る境界</h1><div class="lead">記録側の失敗を、元の業務へ波及させないための確認点</div><img class="art" src="infographic-illustration.png" alt=""><div class="pill">分離は、確認の出発点</div><div class="grid"><section class="card"><div class="kicker">業務の結果</div><h2>元の振る舞いを保つ</h2><p>戻り値・再送出・応答<br>業務トランザクション<br>再試行・後片付け</p></section><section class="card"><div class="kicker">記録の確定</div><h2>保留と登録を分ける</h2><p>別の処理で台帳へ反映<br>確定後に保留を除去</p></section><section class="card"><div class="kicker">認証と情報</div><h2>副作用と収集を絞る</h2><p>セッションへの影響を確認<br>許可した項目だけを保存</p></section><section class="card"><div class="kicker">検証の範囲</div><h2>証拠を分けて示す</h2><p>静的・合成・配信を区別<br>実操作の通し確認は未実施</p></section></div><div class="bottom">保留保存 ≠ 台帳登録完了<br>記録できない境界と、停止方法まで設計する</div><div class="caption">絵は分離を表す比喩です。<br>実際の構成や到達保証を示しません。</div></body></html>
