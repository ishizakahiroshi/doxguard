<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><title>05-slack-route-setup</title><desc>ChatGPTは設定のApps / PluginsからSlackを接続して許可する。Claude CodeはSlack公式プラグインを導入し、/mcpでOAuth認証後に新しいセッションを開く。両方で自分宛てDM、dotsへの1通、返信スレッドの読み取りを確かめる。</desc><defs><marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11" fill="none" stroke="#176B70" stroke-width="2"/></marker><linearGradient id="heroFade"><stop offset="0" stop-color="#F7F4ED" stop-opacity=".96"/><stop offset=".63" stop-color="#F7F4ED" stop-opacity=".84"/><stop offset="1" stop-color="#F7F4ED" stop-opacity="0"/></linearGradient></defs><rect x="0" y="0" width="1600" height="900" rx="0" fill="#F7F4ED"/><text x="57" y="78" font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif" font-size="46" font-weight="700" fill="#17353E" text-anchor="start">図2  接続方法は別々。最後の確認は共通。</text><text x="59" y="125" font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif" font-size="25" font-weight="400" fill="#52656B" text-anchor="start">2026年10月4日時点  |  UIや利用条件は公式案内で確認</text><rect x="58" y="160" width="714" height="469" rx="22" fill="#FFFFFF" stroke="#D7E0DC" stroke-width="2"/><rect x="58" y="160" width="714" height="77" rx="22" fill="#E6F1EE"/><rect x="58" y="198" width="714" height="39" rx="0" fill="#E6F1EE"/><text x="88" y="213" font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif" font-size="38" font-weight="700" fill="#176B70" text-anchor="start">ChatGPT</text><rect x="828" y="160" width="714" height="469" rx="22" fill="#FFFFFF" stroke="#D7E0DC" stroke-width="2"/><rect x="828" y="160" width="714" height="77" rx="22" fill="#F7EADF"/><rect x="828" y="198" width="714" height="39" rx="0" fill="#F7EADF"/><text x="858" y="213" font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif" font-size="38" font-weight="700" fill="#B5603B" text-anchor="start">Claude Code</text><circle cx="100" cy="288" r="20" fill="#176B70"/><text x="100" y="297" font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif" font-size="23" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="139" y="300" font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif" font-size="30" font-weight="500" fill="#17353E" text-anchor="start">設定 → Apps / Plugins → Slack</text><circle cx="100" cy="385" r="20" fill="#176B70"/><text x="100" y="394" font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif" font-size="23" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="139" y="397" font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif" font-size="30" font-weight="500" fill="#17353E" text-anchor="start">Connect → Slack側で許可</text><circle cx="100" cy="482" r="20" fill="#176B70"/><text x="100" y="491" font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif" font-size="23" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="139" y="494" font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif" font-size="30" font-weight="500" fill="#17353E" text-anchor="start">投稿・読取に必要な権限を確認</text><rect x="86" y="555" width="658" height="47" rx="12" fill="#E6F1EE"/><text x="415" y="587" font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif" font-size="25" font-weight="500" fill="#176B70" text-anchor="middle">今回の確認：本人名義・@ChatGPT表示</text><circle cx="870" cy="281" r="20" fill="#B5603B"/><text x="870" y="290" font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif" font-size="23" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="909" y="293" font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif" font-size="30" font-weight="500" fill="#17353E" text-anchor="start">Slack公式プラグインを導入</text><circle cx="870" cy="385" r="20" fill="#B5603B"/><text x="870" y="394" font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif" font-size="23" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="909" y="397" font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif" font-size="30" font-weight="500" fill="#17353E" text-anchor="start">/mcp で OAuth 認証</text><circle cx="870" cy="482" r="20" fill="#B5603B"/><text x="870" y="491" font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif" font-size="23" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="909" y="494" font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif" font-size="30" font-weight="500" fill="#17353E" text-anchor="start">新しいセッションを開く</text><text x="909" y="338" font-family="Noto Sans Mono CJK JP, Consolas, monospace" font-size="26" font-weight="500" fill="#52656B" text-anchor="start">claude plugin install slack</text><rect x="856" y="555" width="658" height="47" rx="12" fill="#F7EADF"/><text x="1185" y="587" font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif" font-size="25" font-weight="500" fill="#B5603B" text-anchor="middle">今回の確認：本人名義・@Claude表示</text><rect x="58" y="664" width="1484" height="166" rx="22" fill="#17353E"/><text x="91" y="707" font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif" font-size="31" font-weight="600" fill="#FFFFFF" text-anchor="start">共通の確認：送信成功と、返信を読めることを分ける</text><rect x="91" y="738" width="378" height="65" rx="12" fill="#FFFFFF"/><text x="280.0" y="782" font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif" font-size="30" font-weight="700" fill="#17353E" text-anchor="middle">自分宛てDMへ1通</text><rect x="589" y="738" width="378" height="65" rx="12" fill="#FFFFFF"/><text x="778.0" y="782" font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif" font-size="30" font-weight="700" fill="#17353E" text-anchor="middle">dotsへ1通</text><rect x="1087" y="738" width="421" height="65" rx="12" fill="#FFFFFF"/><text x="1297.5" y="782" font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif" font-size="30" font-weight="700" fill="#17353E" text-anchor="middle">返信スレッドを読む</text><path d="M485,771 L571,771" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/><path d="M558 760 L572 771 L558 782" fill="none" stroke="#FFFFFF" stroke-width="4"/><path d="M983,771 L1069,771" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/><path d="M1056 760 L1070 771 L1056 782" fill="none" stroke="#FFFFFF" stroke-width="4"/><text x="60" y="872" font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif" font-size="25" font-weight="400" fill="#52656B" text-anchor="start">権限・管理者承認・使える機能は環境によって異なる。接続後は実際に1通ずつ確認する。</text></svg>