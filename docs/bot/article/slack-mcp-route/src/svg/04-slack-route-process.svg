<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><title>04-slack-route-process</title><desc>案件番号、GitHubの固定指示書、Slackでの依頼、dotsの受付、看板の更新、独立レビューと手元検収の順に進む。外側の読み取り専用監視はGitHubの更新状況を見て、停滞時にdotsへ理由を聞く。</desc><defs><marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11" fill="none" stroke="#176B70" stroke-width="2"/></marker><linearGradient id="heroFade"><stop offset="0" stop-color="#F7F4ED" stop-opacity=".96"/><stop offset=".63" stop-color="#F7F4ED" stop-opacity=".84"/><stop offset="1" stop-color="#F7F4ED" stop-opacity="0"/></linearGradient></defs><rect x="0" y="0" width="1600" height="900" rx="0" fill="#F7F4ED"/><text x="56" y="80" font-family="Noto Sans CJK JP" font-size="47" font-weight="700" fill="#17353E" text-anchor="start">図1  依頼から検収まで、証跡でつなぐ</text><text x="58" y="130" font-family="Noto Sans CJK JP" font-size="28" font-weight="400" fill="#52656B" text-anchor="start">指示を渡す経路と、外から確かめる経路を分ける</text><rect x="54" y="216" width="230" height="305" rx="20" fill="#FFFFFF" stroke="#D7E0DC" stroke-width="2"/><circle cx="99" cy="254" r="24" fill="#176B70"/><text x="99" y="264" font-family="Noto Sans CJK JP" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="169" y="327" font-family="Noto Sans CJK JP" font-size="30" font-weight="700" fill="#17353E" text-anchor="middle">案件番号</text><text x="169" y="390" font-family="Noto Sans CJK JP" font-size="24" font-weight="400" fill="#52656B" text-anchor="middle">手元で採番</text><text x="169" y="434" font-family="Noto Sans CJK JP" font-size="24" font-weight="400" fill="#52656B" text-anchor="middle">GitHub番号とは別</text><path d="M288,363 L302,363" fill="none" stroke="#176B70" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="306" y="216" width="230" height="305" rx="20" fill="#FFFFFF" stroke="#D7E0DC" stroke-width="2"/><circle cx="351" cy="254" r="24" fill="#176B70"/><text x="351" y="264" font-family="Noto Sans CJK JP" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="421" y="327" font-family="Noto Sans CJK JP" font-size="30" font-weight="700" fill="#17353E" text-anchor="middle">固定指示書</text><text x="421" y="390" font-family="Noto Sans CJK JP" font-size="24" font-weight="400" fill="#52656B" text-anchor="middle">GitHubのcommit</text><text x="421" y="434" font-family="Noto Sans CJK JP" font-size="24" font-weight="400" fill="#52656B" text-anchor="middle">に指示を固定</text><path d="M540,363 L554,363" fill="none" stroke="#176B70" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="558" y="216" width="230" height="305" rx="20" fill="#FFFFFF" stroke="#D7E0DC" stroke-width="2"/><circle cx="603" cy="254" r="24" fill="#176B70"/><text x="603" y="264" font-family="Noto Sans CJK JP" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="673" y="327" font-family="Noto Sans CJK JP" font-size="30" font-weight="700" fill="#17353E" text-anchor="middle">Slackで依頼</text><text x="673" y="390" font-family="Noto Sans CJK JP" font-size="24" font-weight="400" fill="#52656B" text-anchor="middle">ChatGPT / Claude</text><text x="673" y="434" font-family="Noto Sans CJK JP" font-size="24" font-weight="400" fill="#52656B" text-anchor="middle">同じ案件スレッド</text><path d="M792,363 L806,363" fill="none" stroke="#176B70" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="810" y="216" width="230" height="305" rx="20" fill="#FFFFFF" stroke="#D7E0DC" stroke-width="2"/><circle cx="855" cy="254" r="24" fill="#176B70"/><text x="855" y="264" font-family="Noto Sans CJK JP" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text><text x="925" y="327" font-family="Noto Sans CJK JP" font-size="30" font-weight="700" fill="#17353E" text-anchor="middle">dotsの受付</text><text x="925" y="390" font-family="Noto Sans CJK JP" font-size="24" font-weight="400" fill="#52656B" text-anchor="middle">衝突・commit・</text><text x="925" y="434" font-family="Noto Sans CJK JP" font-size="24" font-weight="400" fill="#52656B" text-anchor="middle">環境を実確認</text><path d="M1044,363 L1058,363" fill="none" stroke="#176B70" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="1062" y="216" width="230" height="305" rx="20" fill="#FFFFFF" stroke="#D7E0DC" stroke-width="2"/><circle cx="1107" cy="254" r="24" fill="#176B70"/><text x="1107" y="264" font-family="Noto Sans CJK JP" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text><text x="1177" y="327" font-family="Noto Sans CJK JP" font-size="30" font-weight="700" fill="#17353E" text-anchor="middle">看板を更新</text><text x="1177" y="390" font-family="Noto Sans CJK JP" font-size="24" font-weight="400" fill="#52656B" text-anchor="middle">PROGRESS.md</text><text x="1177" y="434" font-family="Noto Sans CJK JP" font-size="24" font-weight="400" fill="#52656B" text-anchor="middle">証跡と次の一手</text><path d="M1296,363 L1310,363" fill="none" stroke="#176B70" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="1314" y="216" width="230" height="305" rx="20" fill="#FFFFFF" stroke="#D7E0DC" stroke-width="2"/><circle cx="1359" cy="254" r="24" fill="#176B70"/><text x="1359" y="264" font-family="Noto Sans CJK JP" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="middle">6</text><text x="1429" y="327" font-family="Noto Sans CJK JP" font-size="30" font-weight="700" fill="#17353E" text-anchor="middle">独立レビュー</text><text x="1429" y="390" font-family="Noto Sans CJK JP" font-size="24" font-weight="400" fill="#52656B" text-anchor="middle">別担当の確認</text><text x="1429" y="434" font-family="Noto Sans CJK JP" font-size="24" font-weight="400" fill="#52656B" text-anchor="middle">＋手元検収</text><text x="59" y="599" font-family="Noto Sans CJK JP" font-size="32" font-weight="700" fill="#176B70" text-anchor="start">外側の停滞監視</text><text x="350" y="599" font-family="Noto Sans CJK JP" font-size="25" font-weight="400" fill="#52656B" text-anchor="start">読み取り専用・別の非公開repoから観測</text><rect x="54" y="638" width="426" height="181" rx="18" fill="#E6F1EE"/><text x="79" y="683" font-family="Noto Sans CJK JP" font-size="30" font-weight="700" fill="#17353E" text-anchor="start">GitHubの状態</text><text x="79" y="735" font-family="Noto Sans CJK JP" font-size="26" font-weight="400" fill="#52656B" text-anchor="start">branch・PR・CIなど</text><text x="79" y="778" font-family="Noto Sans CJK JP" font-size="26" font-weight="400" fill="#52656B" text-anchor="start">実際の更新状況を取得</text><rect x="562" y="638" width="426" height="181" rx="18" fill="#E6F1EE"/><text x="587" y="683" font-family="Noto Sans CJK JP" font-size="30" font-weight="700" fill="#17353E" text-anchor="start">一定時間の変化を確認</text><text x="587" y="735" font-family="Noto Sans CJK JP" font-size="26" font-weight="400" fill="#52656B" text-anchor="start">動きがなければ「停滞」</text><text x="587" y="778" font-family="Noto Sans CJK JP" font-size="26" font-weight="400" fill="#52656B" text-anchor="start">検知だけでは理由は分からない</text><rect x="1070" y="638" width="476" height="181" rx="18" fill="#E6F1EE"/><text x="1095" y="683" font-family="Noto Sans CJK JP" font-size="30" font-weight="700" fill="#17353E" text-anchor="start">dotsに状況を聞く</text><text x="1095" y="735" font-family="Noto Sans CJK JP" font-size="26" font-weight="400" fill="#52656B" text-anchor="start">同じ案件の会話へ戻る</text><text x="1095" y="778" font-family="Noto Sans CJK JP" font-size="26" font-weight="400" fill="#52656B" text-anchor="start">原因と次の一手を確認</text><path d="M496,729 L545,729" fill="none" stroke="#176B70" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M1004,729 L1053,729" fill="none" stroke="#176B70" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><text x="60" y="867" font-family="Noto Sans CJK JP" font-size="25" font-weight="400" fill="#52656B" text-anchor="start">dotsの完了報告と、手元での検収は別の工程。merge・本番反映は依頼範囲を確認する。</text></svg>