<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><title>02-slack-route-infographic</title><desc>指示はGitHubの固定commit、会話はSlackの案件スレッド、進捗はPROGRESS.mdに置く。送信、受付、完了、検収は別々に確かめる。</desc><defs><marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11" fill="none" stroke="#176B70" stroke-width="2"/></marker><linearGradient id="heroFade"><stop offset="0" stop-color="#F7F4ED" stop-opacity=".96"/><stop offset=".63" stop-color="#F7F4ED" stop-opacity=".84"/><stop offset="1" stop-color="#F7F4ED" stop-opacity="0"/></linearGradient></defs><rect x="0" y="0" width="1600" height="900" rx="0" fill="#F7F4ED"/><image x="0" y="0" width="1600" height="900" preserveAspectRatio="xMidYMid meet" href="../generated/infographic-background.png"/><text x="74" y="94" font-family="Noto Sans CJK JP" font-size="25" font-weight="700" fill="#176B70" text-anchor="start">全体要約</text><text x="72" y="170" font-family="Noto Sans CJK JP" font-size="49" font-weight="700" fill="#17353E" text-anchor="start">依頼をつなぐ、3つの置き場</text><circle cx="108" cy="278" r="34" fill="#176B70"/><text x="108" y="288" font-family="Noto Sans CJK JP" font-size="25" font-weight="700" fill="#FFFFFF" text-anchor="middle">01</text><text x="169" y="296" font-family="Noto Sans CJK JP" font-size="39" font-weight="700" fill="#17353E" text-anchor="start">GitHubに「指示」</text><text x="169" y="349" font-family="Noto Sans CJK JP" font-size="28" font-weight="400" fill="#52656B" text-anchor="start">内容はcommitで固定。</text><text x="169" y="392" font-family="Noto Sans CJK JP" font-size="28" font-weight="400" fill="#52656B" text-anchor="start">どちらのAIからも同じ指示書を参照する。</text><circle cx="108" cy="464" r="34" fill="#176B70"/><text x="108" y="474" font-family="Noto Sans CJK JP" font-size="25" font-weight="700" fill="#FFFFFF" text-anchor="middle">02</text><text x="169" y="482" font-family="Noto Sans CJK JP" font-size="39" font-weight="700" fill="#17353E" text-anchor="start">Slackに「会話」</text><text x="169" y="535" font-family="Noto Sans CJK JP" font-size="28" font-weight="400" fill="#52656B" text-anchor="start">案件番号と同じスレッドで続ける。</text><text x="169" y="578" font-family="Noto Sans CJK JP" font-size="28" font-weight="400" fill="#52656B" text-anchor="start">受付も質問も報告も、依頼と結び付ける。</text><circle cx="108" cy="650" r="34" fill="#176B70"/><text x="108" y="660" font-family="Noto Sans CJK JP" font-size="25" font-weight="700" fill="#FFFFFF" text-anchor="middle">03</text><text x="169" y="668" font-family="Noto Sans CJK JP" font-size="39" font-weight="700" fill="#17353E" text-anchor="start">看板に「証跡」</text><text x="169" y="721" font-family="Noto Sans CJK JP" font-size="28" font-weight="400" fill="#52656B" text-anchor="start">PROGRESS.mdに状態と次の一手。</text><text x="169" y="764" font-family="Noto Sans CJK JP" font-size="28" font-weight="400" fill="#52656B" text-anchor="start">外側の監視と独立レビューで確かめる。</text><rect x="73" y="813" width="1454" height="58" rx="12" fill="#17353E"/><text x="800" y="852" font-family="Noto Sans CJK JP" font-size="29" font-weight="500" fill="#FFFFFF" text-anchor="middle">送信・受付・完了・検収を、別々の証跡で確認する</text></svg>