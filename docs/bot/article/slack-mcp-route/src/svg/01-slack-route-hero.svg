<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><title>01-slack-route-hero</title><desc>ChatGPTとClaudeからSlack経由でdotsに依頼する。生成した二つの経路の背景に日本語のタイトルを重ね、固定の猫素材を右下に配置。</desc><defs><marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11" fill="none" stroke="#176B70" stroke-width="2"/></marker><linearGradient id="heroFade"><stop offset="0" stop-color="#F7F4ED" stop-opacity=".96"/><stop offset=".63" stop-color="#F7F4ED" stop-opacity=".84"/><stop offset="1" stop-color="#F7F4ED" stop-opacity="0"/></linearGradient></defs><rect x="0" y="0" width="1600" height="900" rx="0" fill="#F7F4ED"/><image x="0" y="0" width="1600" height="900" preserveAspectRatio="xMidYMid meet" href="../generated/hero-background.png"/><rect x="0" y="0" width="1150" height="900" fill="url(#heroFade)"/><rect x="82" y="104" width="242" height="49" rx="24" fill="#176B70"/><text x="203" y="138" font-family="Noto Sans CJK JP" font-size="25" font-weight="600" fill="#FFFFFF" text-anchor="middle">仕組みと考え方</text><text x="78" y="295" font-family="Noto Sans CJK JP" font-size="76" font-weight="700" fill="#17353E" text-anchor="start">ChatGPTとClaudeから</text><text x="78" y="408" font-family="Noto Sans CJK JP" font-size="86" font-weight="700" fill="#176B70" text-anchor="start">Slack経由で</text><text x="78" y="521" font-family="Noto Sans CJK JP" font-size="86" font-weight="700" fill="#17353E" text-anchor="start">dotsに依頼する</text><path d="M84,589 L194,589" fill="none" stroke="#B5603B" stroke-width="7" stroke-linecap="round"/><text x="82" y="660" font-family="Noto Sans CJK JP" font-size="35" font-weight="500" fill="#17353E" text-anchor="start">指示は固定し、会話はつなぐ。</text><text x="82" y="713" font-family="Noto Sans CJK JP" font-size="35" font-weight="500" fill="#17353E" text-anchor="start">進捗は証跡で確かめる。</text><text x="82" y="820" font-family="Noto Sans CJK JP" font-size="24" font-weight="500" fill="#52656B" text-anchor="start">固定指示書  /  同じスレッド  /  独立した検収</text><image x="1184" y="592" width="355" height="266.177" preserveAspectRatio="xMidYMid meet" href="../../assets/mascot_cats.png"/></svg>