[package]
name = "doxguard"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
publish = false
description = "Keep personal identity data out of public repositories"
license = "MIT"
repository = "https://github.com/ishizakahiroshi/doxguard"
homepage = "https://github.com/ishizakahiroshi/doxguard"
readme = "README.md"
keywords = ["privacy", "pre-commit", "scanner", "watchlist"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "doxguard"
path = "src/main.rs"

[dependencies]
aho-corasick = "1.1"
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
csv = "1.3"
rayon = "1.10"
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
which = "8.0.5"

[dev-dependencies]
tempfile = "3.20"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
